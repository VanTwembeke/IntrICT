<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Native popover: optional help, visible contact route</title><desc id="d">An illustrated services page with a small explanatory panel above the page, a labelled trigger, an Escape key and a separate contact link.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1529"/><stop offset="1" stop-color="#183641"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".3"/></filter></defs><rect width="1200" height="630" rx="24" fill="url(#bg)"/><g font-family="DejaVu Sans, sans-serif"><text x="64" y="79" fill="#6ce5cf" font-size="17" letter-spacing="4">INTRICT · WEBSITE INTERACTIONS</text><text x="64" y="144" fill="#fff" font-size="42" font-weight="bold">Small help. Clear next step.</text><text x="64" y="185" fill="#b8cbd6" font-size="22">Native popover ≠ modal dialog</text><g transform="translate(64 226)"><rect width="1072" height="337" rx="18" fill="#f2f6fa"/><path d="M0 42H1072" stroke="#ccd8e1"/><circle cx="25" cy="22" r="5" fill="#f08b8b"/><circle cx="44" cy="22" r="5" fill="#f1c566"/><circle cx="63" cy="22" r="5" fill="#55bfa5"/><text x="105" y="28" font-size="14" fill="#46586b">your-business.be / services</text><text x="36" y="96" fill="#172c46" font-size="27" font-weight="bold">Website handover</text><rect x="36" y="118" width="350" height="10" rx="5" fill="#cad6e2"/><rect x="36" y="140" width="285" height="10" rx="5" fill="#dce4ec"/><rect x="36" y="176" width="240" height="48" rx="10" fill="#1a5367"/><text x="56" y="207" fill="white" font-size="18">What is included?</text><path d="M283 199H340L409 128" fill="none" stroke="#13957c" stroke-width="3" stroke-dasharray="6 6"/><rect x="421" y="66" width="411" height="169" rx="15" fill="white" stroke="#13957c" stroke-width="3" filter="url(#shadow)"/><path d="M421 142L402 158L421 169" fill="white" stroke="#13957c" stroke-width="3"/><text x="444" y="105" fill="#18394b" font-size="21" font-weight="bold">A little extra explanation</text><text x="444" y="139" fill="#46586b" font-size="18">Training · access · documentation</text><text x="444" y="172" fill="#46586b" font-size="17">The rest of the page stays usable.</text><text x="444" y="207" fill="#176d5c" font-size="16">Optional help, not hidden essentials.</text><rect x="874" y="81" width="133" height="63" rx="12" fill="#e5edf3" stroke="#b4c5d3" stroke-width="2"/><text x="912" y="122" fill="#213b51" font-size="24">Esc</text><text x="879" y="172" fill="#516578" font-size="15">Close &amp; return</text><path d="M36 254H1036" stroke="#d8e1e9"/><text x="36" y="295" fill="#172c46" font-size="19">Essential route always visible</text><rect x="726" y="270" width="280" height="44" rx="9" fill="#172c46"/><text x="753" y="299" fill="white" font-size="18">Contact your business →</text></g><text x="65" y="604" fill="#b8cbd6" font-size="15">Choose the interaction. Test keyboard, touch, focus and fallback.</text></g></svg>