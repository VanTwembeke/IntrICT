<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Passkeys — a private key and a public key</title><desc>Original IntrICT editorial illustration: a device unlocks a locally managed private key and signs a challenge verified by a service using its public key. Biometrics are not sent to the service.</desc><rect width="1200" height="630" fill="#f1f5f9"/><path d="M0 514H1200" stroke="#d6e0ec"/><g font-family="DejaVu Sans,sans-serif"><text x="66" y="75" font-size="17" fill="#475569" letter-spacing="4">INTRICT / ACCOUNT SECURITY</text><text x="66" y="154" font-size="60" font-weight="700" fill="#0f172a">PASSKEYS</text><text x="66" y="194" font-size="21" fill="#64748b">One key pair. No shared password.</text><text x="66" y="580" font-size="15" fill="#64748b" letter-spacing="2">ORIGINAL EDITORIAL ILLUSTRATION</text></g><rect x="96" y="247" width="410" height="230" rx="24" fill="#0f172a"/><rect x="134" y="270" width="104" height="180" rx="18" fill="#e2e8f0"/><rect x="147" y="296" width="78" height="113" rx="7" fill="#ffffff"/><path d="M177 378C157 351 162 328 187 327C213 329 219 352 201 381M173 370C164 348 168 338 185 337C203 337 208 352 195 375M181 368C174 351 178 346 185 346C196 345 197 357 187 373" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/><circle cx="186" cy="430" r="7" fill="#94a3b8"/><circle cx="310" cy="335" r="21" fill="none" stroke="#60a5fa" stroke-width="8"/><path d="M329 335H400M383 335V352M400 335V348" stroke="#60a5fa" stroke-width="8" fill="none"/><g font-family="DejaVu Sans,sans-serif" font-size="14" fill="#cbd5e1" letter-spacing="2"><text x="281" y="404">PRIVATE KEY</text></g><path d="M531 318H638L624 306M638 318L624 330" fill="none" stroke="#1d4ed8" stroke-width="4"/><path d="M638 400H531L545 388M531 400L545 412" fill="none" stroke="#64748b" stroke-width="3"/><g font-family="DejaVu Sans,sans-serif" font-size="11" fill="#475569" letter-spacing="1"><text x="540" y="295">SIGNATURE</text><text x="541" y="436">CHALLENGE</text></g><rect x="669" y="248" width="457" height="228" rx="24" fill="#ffffff" stroke="#cbd5e1"/><rect x="704" y="274" width="387" height="38" rx="7" fill="#e2e8f0"/><circle cx="724" cy="293" r="4" fill="#94a3b8"/><circle cx="741" cy="293" r="4" fill="#94a3b8"/><circle cx="758" cy="293" r="4" fill="#94a3b8"/><circle cx="762" cy="365" r="19" fill="none" stroke="#1d4ed8" stroke-width="7"/><path d="M782 365H851M832 365V381M850 365V378" stroke="#1d4ed8" stroke-width="7" fill="none"/><circle cx="1043" cy="367" r="24" fill="#dcfce7"/><path d="M1032 367L1040 375L1055 358" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round"/><g font-family="DejaVu Sans,sans-serif" font-size="14" fill="#475569" letter-spacing="2"><text x="715" y="423">PUBLIC KEY / SERVICE</text></g></svg>